line-length = 80
# Vendored third-party code keeps its upstream formatting. force-exclude makes
# the exclusion apply to files passed explicitly (scripts/format/python.sh).
extend-exclude = ["coltap/coltap/third_party"]
force-exclude = true

[lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = ["SIM117"]

[lint.isort]
known-first-party = ["coltap"]

[lint.per-file-ignores]
"scripts/python/*.py" = ["E", "SIM", "UP", "B"]
